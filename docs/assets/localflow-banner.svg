      <text x="159" y="167" fill="#242842" font-size="17" font-weight="650">Convert to WebP</text>
      <text x="159" y="190" fill="#686e86" font-size="14">Set quality. Preview the result.</text>
      <rect x="177" y="247" width="321" height="78" rx="14" fill="#7373ef"/>
      <path d="M211 267v18m-7-7 7 7 7-7M200 289v7h22v-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
