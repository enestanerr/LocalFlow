<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">LocalFlow — Your images. Your workflow. Your device.</title>
  <desc id="desc">An illustrated image workflow connects resize, WebP conversion, and ZIP export. PNG, JPEG and WebP stay on your device.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10152e"/><stop offset="1" stop-color="#232656"/></linearGradient>
    <linearGradient id="photo" x2="1" y2="1"><stop stop-color="#5050dc"/><stop offset=".55" stop-color="#b377d3"/><stop offset="1" stop-color="#fac5a4"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#909bf0" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1280" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="24" fill="url(#grid)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="64" y="54" width="44" height="44" rx="12" fill="#7172f3"/>
    <g transform="translate(72 63)" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="m14 0 14 8-14 8L0 8Z"/><path d="m0 14 14 8 14-8M0 20l14 8 14-8"/></g>
    <text x="122" y="86" fill="#fff" font-size="32" font-weight="700" letter-spacing="-1">localflow<tspan fill="#9a9bff">.</tspan></text>
    <text x="64" y="184" fill="#fff" font-size="54" font-weight="750" letter-spacing="-2">Your images.</text>
    <text x="64" y="245" fill="#fff" font-size="54" font-weight="750" letter-spacing="-2">Your workflow.</text>
    <text x="64" y="306" fill="#a5a6ff" font-size="54" font-weight="750" letter-spacing="-2">Your device.</text>
    <text x="66" y="362" fill="#c4c8e0" font-size="20">Batch image processing. No uploads.</text>
    <rect x="64" y="406" width="218" height="39" rx="19.5" fill="#303957" stroke="#4b6472"/>
    <circle cx="86" cy="426" r="4" fill="#78dcad"/>
    <text x="101" y="432" fill="#c6f2dd" font-size="15" font-weight="600">PNG · JPEG · WebP</text>
    <g transform="translate(642 84)">
      <path d="M67 97V160H224V231H430" fill="none" stroke="#777ae4" stroke-width="2" stroke-dasharray="5 7"/>
      <rect x="18" y="14" width="164" height="106" rx="13" fill="#525492" stroke="#898be5"/>
      <rect x="9" y="7" width="164" height="106" rx="13" fill="#676ad2" stroke="#9d9deb"/>
      <rect width="164" height="106" rx="13" fill="url(#photo)" stroke="#a3a1f6"/>
      <g fill="none" stroke="#fff" stroke-opacity=".2"><circle cx="96" cy="82" r="27"/><circle cx="96" cy="82" r="42"/><circle cx="96" cy="82" r="57"/></g>
      <rect x="198" y="28" width="300" height="78" rx="14" fill="#f9faff"/>
      <rect x="214" y="44" width="45" height="45" rx="11" fill="#ecebff"/>
      <path d="M226 64v-8h8m12 11v10h-10M226 56l8 8m12 13-8-8" fill="none" stroke="#6360db" stroke-width="2"/>
      <text x="274" y="59" fill="#242842" font-size="17" font-weight="650">Resize</text>
      <text x="274" y="82" fill="#686e86" font-size="14">Fit within 1600 × 1600</text>
      <rect x="83" y="136" width="350" height="78" rx="14" fill="#f9faff"/>
