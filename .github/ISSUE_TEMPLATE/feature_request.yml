name: Feature request
description: Describe an image workflow LocalFlow could improve.
title: 'feat: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the concrete task and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior
      description: Explain the expected inputs and outputs, and any alternatives you have tried.
    validations:
      required: true
